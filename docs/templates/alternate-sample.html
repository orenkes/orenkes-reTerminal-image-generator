<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=800, height=480, initial-scale=1" />
    <title>תצוגה זמנית</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 800px;
        height: 480px;
        display: grid;
        place-items: center;
        background: #0f172a;
        color: #f8fafc;
        font-family: "Rubik", "Segoe UI", sans-serif;
      }
      main {
        text-align: center;
        padding: 32px;
      }
      h1 { margin: 0 0 12px; font-size: 36px; }
      p { margin: 0; font-size: 22px; opacity: 0.9; }
    </style>
  </head>
  <body>
    <main>
      <h1>תוכן זמני</h1>
      <p>חוזר למסך מזג האוויר בעוד שעה</p>
    </main>
  </body>
</html>
