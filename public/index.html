<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>reTerminal image generator</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #ece8df;
        font-family: "Rubik", "Segoe UI", sans-serif;
      }
      main {
        width: min(96vw, 900px);
        padding: 24px;
      }
      iframe {
        width: 100%;
        aspect-ratio: 800 / 480;
        border: 0;
        border-radius: 18px;
        box-shadow: 0 24px 80px rgba(29, 35, 48, 0.14);
        background: #fff;
      }
      .meta {
        margin-top: 12px;
        font-size: 14px;
        color: #5e6577;
        display: flex;
        flex-wrap: wrap;
        gap: 10px 16px;
      }
      code {
        background: rgba(29, 35, 48, 0.08);
        border-radius: 999px;
        padding: 2px 8px;
      }
      a { color: #1d4f91; }
    </style>
  </head>
  <body>
    <main>
      <iframe src="/current.html" title="תצוגה פעילה"></iframe>
      <div class="meta">
        <div>reTerminal: <code>/current.html</code></div>
        <div><a href="/__status">סטטוס</a></div>
        <div><a href="#" id="refresh">רענון מזג אוויר</a></div>
      </div>
    </main>
    <script>
      document.getElementById("refresh").addEventListener("click", async (e) => {
        e.preventDefault();
        await fetch("/__refresh", { method: "POST" });
        location.reload();
      });
    </script>
  </body>
</html>
