<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>reTerminal image generator</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #f8f4ee 0%, #ebf0f6 100%);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(96vw, 1200px);
        padding: 24px;
      }
      img {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 24px;
        box-shadow: 0 24px 80px rgba(29, 35, 48, 0.12);
      }
      .meta {
        margin-top: 12px;
        font-size: 14px;
        color: #5e6577;
        display: flex;
        justify-content: space-between;
        gap: 16px;
      }
      code {
        background: rgba(29, 35, 48, 0.08);
        border-radius: 999px;
        padding: 2px 8px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/current.svg" alt="Daily image" />
      <div class="meta">
        <div>Fixed image URL: <code>/current.svg</code></div>
        <div>Generated image only, no app shell needed.</div>
      </div>
    </main>
  </body>
</html>
